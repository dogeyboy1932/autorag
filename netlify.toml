# Netlify deploy configuration.
#
# The app is a static export (`output: 'export'` in next.config.mjs), so there is
# no adapter and no server — Netlify serves `out/` as files. That is a deliberate
# property rather than a simplification: the whole engine runs in the browser,
# and a build that cannot accidentally grow a server cannot accidentally grow a
# place to put someone's corpus.

[build]
  # The extension is built and packed here rather than committed. `output:
  # 'export'` copies `public/` into `out/`, so the zip lands at
  # `/autorag-extension.zip` with no route to write and nothing to keep in sync.
  #
  # Order matters: `ext` produces extension/dist, `ext:zip` packs it into
  # public/, and only then does `build` copy public/ into out/. Running `build`
  # first would publish a site whose download link 404s.
  command = "pnpm ext && pnpm ext:zip && pnpm build"
  publish = "out"

[functions]
  # The one place in this project that holds the author's Anthropic key. A static
  # export has no server, so there is nowhere else a secret could live: anything
  # in the bundle is readable by anyone who opens devtools.
  #
  # Needs three variables on the deploy (Site configuration → Environment
  # variables):
  #
  #   ANTHROPIC_API_KEY      the author's key. Set a spend limit on it.
  #   DIRECTORY_URL          the DIRECTORY project (.env2), not the corpus one
  #   DIRECTORY_SECRET_KEY   its sb_secret_ key, which is what lets the Function
  #                          read a usage table nobody else can touch
  #
  # Named DIRECTORY_* rather than SUPABASE_* on purpose: there are two Supabase
  # projects here, and pointing the counter at the corpus one finds no demo_usage
  # table and pauses the demo with nothing saying which database was wrong.
  directory = "netlify/functions"

[build.environment]
  # 22 rather than the image default so the toolchain is pinned: extension/zip.mjs
  # uses `zlib.crc32`, which landed in Node 20.15.
  NODE_VERSION = "22"

# NOTE: COOP/COEP are deliberately NOT set here, for the same reason
# next.config.mjs gives. They would enable SharedArrayBuffer and multi-threaded
# WASM, but they would also block the cross-origin Hugging Face fetch that
# downloads the embedding model, because that CDN does not send CORP. The app
# would come up looking fine and never finish loading its model. WebGPU with a
# single-threaded WASM fallback is the trade we want.

[[headers]]
  for = "/autorag-extension.zip"
  [headers.values]
    # Named so it does not land in Downloads as a hash, and not cached hard: the
    # zip is rebuilt on every deploy and someone who downloads a stale one gets
    # an extension that disagrees with the site it came from.
    Content-Disposition = "attachment; filename=\"autorag-extension.zip\""
    Cache-Control = "public, max-age=0, must-revalidate"
